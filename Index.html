<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Sederhana</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #e8efff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 350px;
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    color: #82e1f6;
    margin-top: 5px;
}

#layar {
    width: 100%;
    height: 70px;
    border: 2px solid #b8caff;
    border-radius: 12px;
    margin-bottom: 15px;
    text-align: right;
    padding: 10px;
    font-size: 28px;
    color: #333;
    background: #f7f9ff;
}

.tombol {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #a4befb;
    font-size: 22px;
    font-weight: bold;
    color: #344b7a;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
    background: #c3d4ff;
}

.operator {
    background: #9db9ff;
    color: white;
}

.hapus {
    background: #ff9999;
    color: white;
}

.hasil {
    background: #5276c9;
    color: white;
}

.nol {
    grid-column: span 2;
}

</style>
</head>

<body>

<div class="container">

    <h2>🧮 Kalkulator</h2>

    <input type="text" id="layar" value="0" readonly>

    <div class="tombol">

        <button class="hapus" onclick="hapus()">C</button>
        <button onclick="hapusSatu()">⌫</button>
        <button class="operator" onclick="masuk('/')">÷</button>
        <button class="operator" onclick="masuk('*')">×</button>

        <button onclick="masuk('7')">7</button>
        <button onclick="masuk('8')">8</button>
        <button onclick="masuk('9')">9</button>
        <button class="operator" onclick="masuk('-')">−</button>

        <button onclick="masuk('4')">4</button>
        <button onclick="masuk('5')">5</button>
        <button onclick="masuk('6')">6</button>
        <button class="operator" onclick="masuk('+')">+</button>

        <button onclick="masuk('1')">1</button>
        <button onclick="masuk('2')">2</button>
        <button onclick="masuk('3')">3</button>
        <button class="hasil" onclick="hitung()">=</button>

        <button class="nol" onclick="masuk('0')">0</button>
        <button onclick="masuk('.')">.</button>

    </div>

</div>

<script>

let layar = document.getElementById("layar");
let ekspresi = "";

/**
 * @param {string} nilai
 */
function masuk(nilai) {
    ekspresi += nilai;
    layar.value = ekspresi;
}

function hapus() {
    ekspresi = "";
    layar.value = "0";
}

function hapusSatu() {
    ekspresi = ekspresi.slice(0, -1);
    layar.value = ekspresi || "0";
}

function hitung() {
    try {

        if (ekspresi === "") {
            return;
        }

        if (!/^[0-9+\-*/. ]+$/.test(ekspresi)) {
            throw new Error("Input tidak valid");
        }

        let hasil = Function(
            '"use strict"; return (' + ekspresi + ')'
        )();

        if (!Number.isFinite(hasil)) {
            throw new Error("Hasil tidak valid");
        }

        ekspresi = String(hasil);
        layar.value = ekspresi;

    } catch (error) {

        layar.value = "Error";
        ekspresi = "";

    }
}

</script>

</body>
</html>
